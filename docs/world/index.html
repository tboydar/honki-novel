<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>多重世界線｜重生之 Debug 博士逆轉台北</title>
<meta name="description" content="《重生之 Debug 博士逆轉台北》互動世界：五條世界線、五個 3D 場景。這個故事有一萬種結局，你正在看的是之一。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141210;--paper:#f4ecdc;--seal:#c8322f;--gold:#c9962e;
  --disp:'LXGW WenKai TC','Noto Serif TC','Songti TC',serif;--body:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
  --bar:0px;--ease:150ms ease-out}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
a{color:var(--seal)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.paper{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink)}
.seal{display:inline-block;background:var(--seal);color:var(--paper);font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.08em;padding:2px 8px;border-radius:3px;border:2px solid var(--ink);transform:rotate(-2deg)}
button{font:inherit;color:inherit}
.btn{min-height:44px;padding:0 14px;font-family:var(--disp);font-weight:700;font-size:14px;cursor:pointer;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);
  transition:transform var(--ease),box-shadow var(--ease),background var(--ease)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--gold)}

#hud-tl{position:fixed;top:calc(var(--st) + 12px);left:calc(var(--sl) + 12px);width:min(340px,calc(100vw - 24px - var(--sl) - var(--sr)));padding:10px 14px 8px;z-index:5}
#wl-title{margin:6px 0 2px;font-family:var(--disp);font-size:20px;line-height:1.3}
#wl-hint{margin:2px 0 0;font-size:12.5px;line-height:1.6}
#wl-hint.gone{display:none}
#framing{margin:6px 0 0;font-size:12px;line-height:1.6;color:var(--seal);font-weight:700}
#hud-tl a{display:inline-block;margin-top:2px;padding:10px 0 4px;font-size:13px;text-decoration:none;font-weight:700}
#hud-tl a:hover{text-decoration:underline}

#rail{position:fixed;left:calc(var(--sl) + 12px);top:calc(var(--st) + 200px);display:flex;flex-direction:column;gap:8px;z-index:5}
.wl{display:flex;align-items:center;gap:8px;width:156px;min-height:48px;padding:0 10px;cursor:pointer;text-align:left;
  background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);
  transition:transform var(--ease),box-shadow var(--ease),background var(--ease),color var(--ease)}
.wl:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.wl:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.wl .seal-s{font-family:var(--disp);font-weight:700;font-size:12px;background:var(--seal);color:var(--paper);padding:2px 5px;border-radius:3px;transform:rotate(-3deg);letter-spacing:.04em;transition:background var(--ease),color var(--ease)}
.wl .nm{font-family:var(--disp);font-weight:700;font-size:15px}
.wl[aria-current="page"]{background:var(--seal);color:var(--paper)}
.wl[aria-current="page"] .seal-s{background:var(--paper);color:var(--seal)}

#audio-bar{position:fixed;top:calc(var(--st) + 12px);right:calc(var(--sr) + 12px);display:flex;gap:8px;z-index:5}
#credit{position:fixed;left:50%;transform:translateX(-50%);white-space:nowrap;bottom:calc(var(--sb) + var(--bar) + 3px);font-size:11px;color:var(--paper);text-shadow:0 1px 3px var(--ink);z-index:5;pointer-events:none}

#hud-bl{position:fixed;left:calc(var(--sl) + 12px);bottom:calc(var(--sb) + var(--bar) + 12px);display:none;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:5}
body.scene-taipei #hud-bl{display:flex}
.pill{padding:6px 12px;font-size:14px;white-space:nowrap}
.pill b{font-family:var(--disp);font-size:18px;margin-left:2px}
#kills{color:var(--seal)}

#sand-hud{position:fixed;left:calc(var(--sl) + 12px);bottom:calc(var(--sb) + var(--bar) + 12px);right:calc(var(--sr) + 100px);max-width:440px;display:none;padding:8px 12px;z-index:5;pointer-events:none}
body.scene-sand #sand-hud{display:block}
#poem{font-family:var(--disp);font-size:15px;letter-spacing:.1em}
#sand-cap{margin-top:2px;font-size:12px;color:var(--seal);font-weight:700}
#zoom-btn{position:fixed;right:calc(var(--sr) + 12px);bottom:calc(var(--sb) + var(--bar) + 12px);display:none;min-width:76px;min-height:52px;font-size:18px;z-index:5;background:var(--gold)}
body.scene-sand #zoom-btn{display:block}

#toast{position:fixed;left:50%;bottom:calc(var(--sb) + var(--bar) + 70px);transform:translate(-50%,10px);max-width:min(440px,calc(100vw - 32px));
  padding:8px 16px 10px;font-size:15px;line-height:1.5;text-align:center;opacity:0;pointer-events:none;transition:opacity 200ms ease-out,transform 200ms ease-out;z-index:20}
#toast::before{content:'艾莉絲';display:block;font-family:var(--disp);font-size:11px;color:var(--seal);letter-spacing:.2em;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}
#caption{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + var(--bar) + 26px);max-width:min(560px,calc(100vw - 32px));padding:6px 14px;font-size:14px;line-height:1.6;text-align:center;z-index:6}

#card{position:fixed;z-index:15;top:calc(var(--st) + 68px);right:calc(var(--sr) + 12px);width:min(340px,calc(100vw - 24px));padding:16px 18px}
#card-label{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--seal);letter-spacing:.18em}
#card-title{margin:4px 0 8px;font-family:var(--disp);font-size:18px;line-height:1.5;padding-right:36px}
#card-line{margin:0 0 14px;font-size:14px;line-height:1.75}
#card-link{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;background:var(--gold);color:var(--ink);font-family:var(--disp);font-weight:700;text-decoration:none;font-size:15px;
  border:2px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--ink);transition:transform var(--ease),box-shadow var(--ease)}
#card-link:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
#card-close{position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;background:none;cursor:pointer;font-size:22px;font-family:var(--disp)}
#card-close:hover{color:var(--seal)}

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(20,18,16,.78)}
#overlay .box{max-width:420px;padding:26px 24px;text-align:center}
#overlay h2{margin:0 0 10px;font-family:var(--disp);font-size:26px;color:var(--seal)}
#overlay p{margin:0 0 18px;line-height:1.7;font-size:15px}
#overlay .btn{background:var(--gold);padding:0 22px;font-size:16px}
#overlay .back{display:block;margin-top:14px;font-size:13px;font-weight:700}
#fallback{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:12px;line-height:1.7;background:var(--paper)}
[hidden]{display:none!important}

@media (max-width:720px){
  :root{--bar:58px}
  #hud-tl{width:calc(100vw - 24px - var(--sl) - var(--sr) - 92px);padding:8px 10px 4px}
  #wl-title{font-size:17px}
  #framing{font-size:11.5px}
  #rail{left:0;right:0;top:auto;bottom:0;flex-direction:row;gap:0;background:var(--ink);padding:0 var(--sr) var(--sb) var(--sl);border-top:2px solid var(--gold)}
  .wl{flex:1;width:auto;min-width:0;flex-direction:column;justify-content:center;gap:2px;min-height:var(--bar);padding:4px 2px;border:0;border-radius:0;box-shadow:none;background:transparent;color:var(--paper);text-align:center}
  .wl:hover,.wl:active{transform:none;box-shadow:none}
  .wl .seal-s{background:none;color:var(--gold);padding:0;transform:none;font-size:11px}
  .wl .nm{font-size:13px;line-height:1.2}
  .wl[aria-current="page"] .seal-s{background:none;color:var(--paper)}
  #audio-bar{flex-direction:column;width:84px}
  #audio-bar .btn{padding:0 6px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
  #card{top:auto;right:0;left:0;bottom:calc(var(--bar) + var(--sb));width:auto;max-height:46vh;overflow:auto;padding:14px 16px}
  body.card-open #toast{bottom:calc(46vh + var(--bar) + var(--sb) + 10px)}
  body.card-open #hud-bl,body.card-open #sand-hud,body.card-open #caption{display:none}
  #toast{bottom:calc(var(--sb) + var(--bar) + 68px)}
  #caption{bottom:calc(var(--sb) + var(--bar) + 24px)}
  #sand-hud{right:calc(var(--sr) + 96px)}
  #credit{font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body class="scene-taipei">
<canvas id="c" aria-label="3D 世界線場景"></canvas>
<div id="hud">
  <div id="hud-tl" class="paper">
    <span id="seal" class="seal">世界線 #0001</span>
    <h1 id="wl-title" style="font-weight:700">深偽獵人・逆轉台北</h1>
    <p id="wl-hint"></p>
    <p id="framing"></p>
    <a href="../index.html">← 回小說首頁</a>
  </div>
  <nav id="rail" aria-label="世界線切換"></nav>
  <div id="audio-bar">
    <button id="btn-sound" class="btn" type="button" aria-pressed="false" aria-label="音效開關，目前關閉">音效：關</button>
    <button id="btn-theme" class="btn" type="button" aria-pressed="false" aria-label="播放主題曲" hidden>主題曲</button>
    <button id="btn-narr" class="btn" type="button" aria-pressed="false" aria-label="播放本世界線旁白" hidden>旁白</button>
  </div>
  <div id="credit" hidden>旁白為 AI 合成配音，非任何真人聲音</div>
  <div id="hud-bl">
    <div class="pill paper">已擊破深偽：<b id="kills">0</b></div>
    <div class="pill paper">記憶碎片 <b id="shards">0 / 13</b></div>
  </div>
  <div id="sand-hud" class="paper">
    <div id="poem">一沙一世界，一花一天國。</div>
    <div id="sand-cap"></div>
  </div>
  <button id="zoom-btn" class="btn" type="button" aria-label="放大，鑽進下一層世界">放大</button>
  <div id="toast" class="paper" role="status" aria-live="polite"></div>
  <div id="caption" class="paper" role="status" aria-live="polite" hidden></div>
  <aside id="card" class="paper" hidden>
    <button id="card-close" type="button" aria-label="關閉">✕</button>
    <div id="card-label"></div>
    <h2 id="card-title"></h2>
    <p id="card-line"></p>
    <a id="card-link" href="../s00.html">閱讀本章 →</a>
  </aside>
  <div id="overlay" hidden>
    <div class="box paper">
      <h2>深偽之夜，守住了！</h2>
      <p>你已擊破 33 支深偽畫面。<br>艾莉絲：「哥～收工啦，去吃滷肉飯！」</p>
      <button id="overlay-keep" class="btn" type="button">繼續獵捕</button>
      <a class="back" href="../index.html">← 回小說首頁</a>
    </div>
  </div>
</div>
<div id="fallback" hidden>
  <h2>此裝置暫時無法顯示 3D 場景</h2>
  <p>瀏覽器沒有開啟 WebGL，艾莉絲進不來這座城市。<br>請改用較新的瀏覽器，或先回去讀小說吧。</p>
  <a href="../index.html">← 回小說首頁</a>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
